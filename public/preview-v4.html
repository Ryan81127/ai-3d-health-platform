</style></head><body><header><h1>AI 3D 人體健康探索與衛教平台 <small>V4 視覺預覽</small></h1><small>健康管理師主導｜3D 示意模型、症狀關聯、人工審核｜非醫療診斷系統</small><a class="quicklink" href="sleep-explorer.html">🌙 挑戰睡眠健康知識</a></header>
<main class="layout"><section class="panel survey"><h2>① 症狀與生活問卷</h2><div id="questions"></div><h3>症狀持續時間</h3><select id="duration"><option>尚未確認</option><option>最近幾天</option><option>數週至數月</option><option>超過半年</option></select><h3>諮詢備註</h3><textarea id="notes" rows="3" placeholder="展示版請勿填入個人可識別健康資料"></textarea><div class="actions"><button id="analyze">產生衛教草稿</button><button id="clear" class="secondary">清除</button></div></section>
<section class="panel viewer"><h2>② 3D 人體器官探索</h2><div id="stage"><span class="hint">拖曳旋轉 · 點擊器官 · 雙指縮放</span><div id="loading" class="card">正在載入 3D 引擎，需要網路連線。</div></div><div class="toolbar"><button class="secondary" data-view="front">正面</button><button class="secondary" data-view="side">側面</button><button class="secondary" data-view="back">背面</button><button class="secondary" id="skin">切換透明外層</button><label class="upload">匯入授權 GLB<input id="model" type="file" accept=".glb" hidden></label></div><div id="modelStatus" class="card">目前使用幾何示意人體。匯入 GLB 後可旋轉檢視，但器官節點映射尚待建置。</div><div id="organInfo" class="card">拖曳旋轉、滾輪縮放、點選器官。</div><small>幾何比例與位置並非醫學級解剖精度。</small></section>
<section class="panel"><h2>③ 衛教草稿與審核</h2><div id="report"><p>請先勾選左側症狀，再產生草稿。</p></div><div class="actions"><label><input type="checkbox" id="approved"> 我已逐項審核此衛教草稿</label><button id="print" disabled>核准後列印／另存 PDF</button></div><div class="card warning">本版為固定規則分析，不是 AI 診斷；尚未串接 AI 後端。不得用於真實個案的臨床判斷。</div></section></main>
<script>
const groups=[
{title:"眼部",items:["眼睛乾澀","視力模糊"],organs:["大腦"],info:"乾眼、螢幕使用、環境及藥物等都可能相關。此模型尚無眼球細部構造；持續症狀建議眼科評估。"},
{title:"頭部與睡眠",items:["經常頭痛","睡眠品質不佳","注意力下降"],organs:["大腦","心臟"],info:"睡眠不足可能影響認知與心血管調節；持續頭痛需評估型態與警訊。"},
{title:"口腔",items:["反覆嘴破","口乾"],organs:["胃","腸道"],info:"口腔潰瘍可能與刺激、壓力、部分營養缺乏或其他疾病有關；不能單憑症狀推定缺乏哪種營養素。"},
{title:"心血管與呼吸",items:["胸痛或胸悶","心悸","活動時喘"],organs:["心臟","左肺","右肺"],info:"胸部不適原因多樣。正在發生的胸痛、嚴重喘或其他急性警訊，應立即尋求醫療協助。"},
{title:"四肢",items:["手腳麻木","肌肉痠痛"],organs:["大腦"],info:"麻木可能涉及神經、姿勢或代謝因素；突然單側無力需緊急就醫。"},
{title:"皮膚與修復",items:["傷口癒合緩慢","皮膚乾燥"],organs:["胰臟","心臟"],info:"傷口癒合緩慢需評估感染、血糖、循環及營養等因素。"},
{title:"消化與代謝",items:["經常口渴","胃脹氣","排便不規律"],organs:["胰臟","胃","腸道"],info:"消化及口渴症狀原因多樣，必要時應由醫師評估。"},
{title:"生活習慣",items:["經常熬夜","飲食不規律","久坐少動","蔬果攝取不足"],organs:["大腦","心臟","肝臟","胰臟"],info:"規律睡眠、均衡飲食與適量活動有助健康維持，但不能取代疾病治療。"}
];
const organText={"大腦":"認知、情緒與睡眠調節","心臟":"血液循環","左肺":"氣體交換","右肺":"氣體交換","肝臟":"代謝與調節","胃":"消化","胰臟":"消化酵素與血糖調節","腸道":"消化吸收","左腎":"體液調節","右腎":"體液調節"};
const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('questions').innerHTML=groups.map((g,i)=>'<h3>'+g.title+'</h3>'+g.items.map(s=>'<label class="check"><input type="checkbox" data-group="'+i+'" value="'+s+'"> '+s+'</label>').join('')).join('');
function invalidate(){$('approved').checked=false;$('print').disabled=true}
$('approved').onchange=()=>{$('print').disabled=!$('approved').checked||!$('report').dataset.ready};
$('print').onclick=()=>window.print();
$('analyze').onclick=()=>{const selected=[...document.querySelectorAll('.check input:checked')];if(!selected.length){alert('請先選擇症狀或生活習慣');return}invalidate();const related=[...new Set(selected.map(x=>Number(x.dataset.group)))].map(i=>groups[i]);const organs=[...new Set(related.flatMap(g=>g.organs))];window.highlightOrgans?.(organs);const urgent=selected.some(x=>['胸痛或胸悶','活動時喘'].includes(x.value));$('report').innerHTML='<h3>個人化衛教草稿</h3><p>日期：'+new Date().toLocaleDateString('zh-TW')+'</p><p>勾選：'+selected.map(x=>escapeHTML(x.value)).join('、')+'</p><p>持續時間：'+escapeHTML($('duration').value)+'</p><p>相關器官（示意）：'+organs.join('、')+'</p>'+(urgent?'<div class="card alert"><b>緊急就醫提醒：</b>目前胸痛、呼吸困難或嚴重症狀應優先就醫。</div>':'')+related.map(g=>'<div class="card"><b>'+g.title+'</b><p>'+g.info+'</p></div>').join('')+'<h3>一般生活建議</h3><p>規律睡眠、均衡飲食、足夠蛋白質與蔬果、適量活動；依個人疾病及用藥情況調整。</p><p>備註：'+escapeHTML($('notes').value||'無')+'</p><small>非診斷，症狀無法直接證明器官損傷或特定營養缺乏。</small>';$('report').dataset.ready='1'};
$('clear').onclick=()=>{document.querySelectorAll('.check input').forEach(x=>x.checked=false);$('notes').value='';$('report').textContent='已清除。';delete $('report').dataset.ready;invalidate();window.highlightOrgans?.([])};
</script>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
import {OrbitControls} from 'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';
const stage=document.getElementById('stage'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,1.4,8);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(renderer.domElement);document.getElementById('loading').remove();
scene.add(new THREE.HemisphereLight(0xeaffff,0x1c3046,2.5));const rim=new THREE.PointLight(0x37e8de,55,10);rim.position.set(-2,2,-2);scene.add(rim);const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,6);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.1,0);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=14;controls.enablePan=false;
const body=new THREE.Group();scene.add(body);const ring=new THREE.Mesh(new THREE.RingGeometry(1.45,1.51,96),new THREE.MeshBasicMaterial({color:0x40e0df,transparent:true,opacity:.65,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=-1.35;scene.add(ring);let imported=null;const meshes={};const skin=[];
function ball(name,pos,scale,color,opacity=1){const mesh=new THREE.Mesh(new THREE.SphereGeometry(1,28,20),new THREE.MeshStandardMaterial({color,transparent:opacity<1,opacity,roughness:.5,side:THREE.DoubleSide}));mesh.position.set(...pos);mesh.scale.set(...scale);mesh.userData.organ=name;body.add(mesh);if(name)(meshes[name]??=[]).push(mesh);else skin.push(mesh);return mesh}
ball(null,[0,1.4,0],[.82,1.13,.43],0x83cfe0,.17);ball(null,[0,3,0],[.42,.5,.4],0x83cfe0,.17);for(const x of [-1,1]){ball(null,[x*.98,1.35,0],[.22,1.02,.22],0x83cfe0,.17);ball(null,[x*.4,-.2,0],[.3,1.13,.29],0x83cfe0,.17)}
ball('大腦',[0,3.04,.08],[.35,.29,.29],0xe5a0b8);ball('左肺',[-.36,1.86,.12],[.3,.54,.25],0x88cce7);ball('右肺',[.36,1.86,.12],[.3,.54,.25],0x88cce7);ball('心臟',[0,1.7,.37],[.25,.3,.2],0xf17b85);ball('肝臟',[.32,1.01,.22],[.45,.23,.28],0xaa7270);ball('胃',[-.28,.98,.26],[.22,.27,.19],0xdca6bd);ball('胰臟',[0,.74,.31],[.39,.11,.15],0xf0ca71);ball('腸道',[0,.28,.2],[.47,.42,.29],0xcba2c8);ball('左腎',[-.48,.75,-.16],[.2,.25,.15],0xb8777d);ball('右腎',[.48,.75,-.16],[.2,.25,.15],0xb8777d);
window.highlightOrgans=names=>{Object.entries(meshes).forEach(([name,list])=>list.forEach(m=>{m.material.emissive.setHex(names.includes(name)?0x29bda4:0);m.material.emissiveIntensity=.5}));document.getElementById('organInfo').textContent=names.length?'相關器官（衛教示意）：'+names.join('、'):'請點選器官'};
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(Object.values(meshes).flat())[0];if(hit){const name=hit.object.userData.organ;window.highlightOrgans([name]);document.getElementById('organInfo').textContent=name+'｜'+organText[name]}});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;camera.position.set(v==='side'?8:0,1.4,v==='back'?-8:v==='side'?0:8);controls.update()});
let show=true;document.getElementById('skin').onclick=()=>{show=!show;skin.forEach(m=>m.visible=show)};
document.getElementById('model').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;const url=URL.createObjectURL(file);try{const gltf=await new GLTFLoader().loadAsync(url);if(imported)scene.remove(imported);imported=gltf.scene;const bounds=new THREE.Box3().setFromObject(imported),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());if(size.length()===0)throw Error('模型尺寸無效');imported.position.sub(center);imported.scale.setScalar(4/Math.max(size.x,size.y,size.z));scene.add(imported);body.visible=false;document.getElementById('modelStatus').textContent='已匯入 '+file.name+'；目前只能旋轉檢視。器官節點映射尚待開發。'}catch(err){document.getElementById('modelStatus').textContent='匯入失敗：'+err.message}finally{URL.revokeObjectURL(url)}};
function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
